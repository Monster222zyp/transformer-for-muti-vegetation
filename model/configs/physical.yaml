# 物理实验测得的单根水草基准阻力，单位为 N。
# 两个状态分别对应两组周期旋转角度，每组包含四档流速的正式实验值。
version: 1
drag_unit: N

states:
  1:
    # 状态 1 对应初始朝向及其 120° 周期旋转。
    angles_deg: [0, 120, 240]
    single_drag_by_flow_speed:
      "0.1": 0.110
      "0.2": 0.458
      "0.3": 1.095
      "0.4": 2.08

  2:
    # 状态 2 相对状态 1 旋转 60°，同样具有 120° 周期。
    angles_deg: [60, 180, 300]
    single_drag_by_flow_speed:
      "0.1": 0.108
      "0.2": 0.416
      "0.3": 0.883
      "0.4": 1.463
